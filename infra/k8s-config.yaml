apiVersion: v1
kind: ConfigMap
metadata:
  name: interview-ai-config
data:
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres-service:5432/interview_ai"
  REDIS_URL: "redis://redis-service:6379/0"
  S3_ENDPOINT: ""
  S3_BUCKET: "interview-ai"
  USE_MINIO: "false"
  OPENAI_MODEL: "gpt-4o"
  WHISPER_MODEL: "base"
---
apiVersion: v1
kind: Secret
metadata:
  name: interview-ai-secrets
type: Opaque
stringData:
  SECRET_KEY: "change-me-in-production"
  OPENAI_API_KEY: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
  PINECONE_API_KEY: ""
