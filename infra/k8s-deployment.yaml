apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-ai-api
  labels:
    app: interview-ai-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: interview-ai-api
  template:
    metadata:
      labels:
        app: interview-ai-api
    spec:
      containers:
        - name: api
          image: interview-ai:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: interview-ai-secrets
            - configMapRef:
                name: interview-ai-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: interview-ai-api
spec:
  selector:
    app: interview-ai-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: interview-ai-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: interview-ai-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
