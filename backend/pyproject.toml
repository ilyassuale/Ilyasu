[project]
name = "interview-ai"
version = "0.1.0"
description = "AI-Powered Virtual Job Interview Simulation System"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AI Interview Team"}
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "openai>=1.35.0",
    "boto3>=1.34.0",
    "minio>=7.2.0",
    "python-docx>=1.1.2",
    "PyMuPDF>=1.24.0",
    "spacy>=3.7.0",
    "sentence-transformers>=3.0.0",
    "pinecone-client>=5.0.0",
    "opencv-python>=4.9.0",
    "mediapipe>=0.10.0",
    "openai-whisper>=20231117",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "python-dotenv>=1.0.0",
    "pydantic-extra-types>=2.8.0",
    "email-validator>=2.2.0",
    "pydantic[email]",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "psycopg2-binary>=2.9.9",
    "prometheus-client>=0.20.0",
    "sentry-sdk>=2.0.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.optional-dependencies]
dev = ["pre-commit>=3.7.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008", "B905"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
